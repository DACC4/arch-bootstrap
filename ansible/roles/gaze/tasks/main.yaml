---
- name: Install v4l-utils (camera detection)
  community.general.pacman:
   name:
    - v4l-utils
   state: present

- name: Install gaze
  become_user: "{{ aur_user }}"
  become: true
  kewlfft.aur.aur:
   name:
    - gaze-bin
    - gaze-gui-bin
    - gaze-gnome-extension-bin

- name: Start and enable gazed service
  ansible.builtin.systemd_service:
   name: gazed
   enabled: true
   state: started

- name: Enable gaze gnome extension
  become_user: "{{ aur_user }}"
  become: true
  check_mode: false
  ansible.builtin.command:
   cmd: "gnome-extensions enable gaze@gundulabs.com"
  changed_when: false
  failed_when: false

- name: Read current gaze settings
  check_mode: false
  ansible.builtin.command:
   cmd: "gaze config get {{ item.key }}"
  loop: "{{ gaze_settings | dict2items }}"
  loop_control:
   label: "{{ item.key }}"
  register: gaze_current_settings
  changed_when: false

- name: Configure gaze settings
  ansible.builtin.command:
   cmd: "gaze config set {{ item.item.key }} {{ item.item.value | string | lower }}"
  loop: "{{ gaze_current_settings.results }}"
  loop_control:
   label: "{{ item.item.key }}"
  when: item.stdout | trim | lower != (item.item.value | string | lower)
  notify: Restart gazed
  changed_when: true

- name: Read current gaze IR camera
  check_mode: false
  ansible.builtin.command:
   cmd: "gaze config get cameras.ir"
  register: gaze_current_ir
  changed_when: false
  failed_when: false

- name: Detect gaze IR camera (greyscale V4L2 capture node)
  check_mode: false
  ansible.builtin.shell:
   executable: /bin/bash
   cmd: |
    set -o pipefail
    for dev in /dev/video*; do
      v4l2-ctl -d "$dev" --list-formats 2>/dev/null | grep -qE "'(GREY|Y8I)'" || continue
      for link in /dev/v4l/by-path/*; do
        if [ "$(readlink -f "$link")" = "$dev" ]; then
          echo "$link"
          exit 0
        fi
      done
      echo "$dev"
      exit 0
    done
  register: gaze_detected_ir
  changed_when: false
  when: gaze_ir_camera | length == 0 and gaze_current_ir.stdout | default('') | trim | length == 0

- name: Configure gaze IR camera
  ansible.builtin.command:
   cmd: "gaze config set cameras.ir '{{ gaze_ir_camera if gaze_ir_camera | length > 0 else gaze_detected_ir.stdout | trim }}'"
  when: >-
   (gaze_ir_camera | length > 0 and gaze_ir_camera != gaze_current_ir.stdout | default('') | trim)
   or (gaze_ir_camera | length == 0 and gaze_detected_ir.stdout | default('') | trim | length > 0)
  notify: Restart gazed
  changed_when: true
